# Sec-LLM CI - backend tests + frontend type check, lint and build
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Byte-compile every backend module
        run: |
          cd backend
          python -m compileall -q . -x '(\.venv|__pycache__)' && echo "compileall OK"

      - name: Unit and regression tests
        working-directory: backend
        env:
          # Integration/browser suites stay opt-in; everything else must run.
          RUN_AGENT_INTEGRATION: "0"
          RUN_AGENT_UI: "0"
        run: >-
          python -m pytest tests/ -q
          -k "not run_recon_no_tools and not run_exploit_empty_blackboard
          and not run_supervisor_basic and not safe_nmap_command_accepted
          and not run_agent_ui"

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit --incremental false

      - name: Lint frontend
        run: |
          cd frontend
          npm run lint

      - name: Agent stream regression
        working-directory: frontend
        run: node --test tests/agent-stream.test.cjs

      - name: Build frontend
        run: |
          cd frontend
          npm run build
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000"
